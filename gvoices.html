<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVoices, Google Voices</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Dark Reader recoloured the amber tab grey and turned the deck's triangles into squares (measured in Marko's
     Chrome, 15.9.2026: data-darkreader-mode=dynamic). The page is dark already; this lock asks it to leave it alone. -->
<meta name="darkreader-lock">
<meta name="color-scheme" content="dark">
<style>
/* AGY UI tokens (design-language.md, MAHA_TRANSCRIBE_TERMUX_TERMINAL): dark, amber, sand, mono */
:root {
  --bg: #0b0d10;  --surface: #0d1117;  --surface-2: #141a21;  --line: #23303d;
  --amber: #f59e0b;  --amber-hi: #fbbf24;  --amber-lo: #b45309;
  --prose: #f2ddb4;  --dim: #8a7a5c;  --red: #ef4444;  --green: #22c55e;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--prose); font: 13px/1.5 var(--mono); }
body { display: flex; justify-content: center; align-items: flex-start;
       padding: calc(14px + env(safe-area-inset-top)) 8px calc(14px + env(safe-area-inset-bottom)); }
.unit { width: 100%; max-width: 720px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
h1 { font-size: 13px; letter-spacing: .12em; margin: 0; color: var(--amber); font-weight: 700; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.head small { color: var(--dim); }
/* the install lines, at the top (Marko, 15.9.2026: "display in the top of that page the installation command with curl") */
.install { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; background: var(--surface-2); }
.install .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.install .tag { color: var(--dim); font-size: 11px; letter-spacing: .08em; width: 62px; flex: none; }
.install code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; color: var(--prose); font-size: 11px; padding: 4px 0; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button, .pill { border: 1px solid var(--line); background: var(--surface-2); color: var(--prose); border-radius: 999px;
  padding: 10px 14px; font: 700 11px var(--mono); letter-spacing: .06em; cursor: pointer; }
.tabs button { flex: 1; }
.tabs button.on, .pill.on { background: var(--amber); color: var(--bg); border-color: var(--amber); }
.panel { display: none; } .panel.on { display: block; }
label.lbl { display: block; color: var(--dim); font-size: 11px; letter-spacing: .08em; margin: 10px 0 4px; }
textarea, input[type=text] { width: 100%; background: var(--bg); color: var(--prose); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; font: 13px/1.5 var(--mono); resize: vertical; }
textarea { min-height: 96px; }
.filters .frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.filters .frow .tag { color: var(--dim); font-size: 11px; letter-spacing: .08em; width: 100%; }
.pill { padding: 8px 12px; font-weight: 400; }
.pill.small { padding: 6px 10px; font-size: 11px; }
.voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
.voice { border: 1px solid var(--line); background: var(--surface-2); color: var(--prose); border-radius: 12px; padding: 8px 10px;
  text-align: left; cursor: pointer; font: 13px var(--mono); }
.voice .nm { font-weight: 700; }
.voice .ch { color: var(--dim); font-size: 11px; }
.voice.on { background: var(--amber); color: var(--bg); } .voice.on .ch { color: #3a2a06; }
.voice.hid { opacity: .25; pointer-events: none; }          /* rule 1: nothing disappears, it becomes inactive */
.big { width: 100%; padding: 16px; margin-top: 12px; background: var(--amber); color: var(--bg); border: none; border-radius: 14px;
  font: 700 13px var(--mono); letter-spacing: .08em; cursor: pointer; }
.big:disabled, .dimmed { opacity: .35; pointer-events: none; }
.player { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface-2); }
.player audio { width: 100%; margin-top: 6px; }
.player .who { color: var(--dim); font-size: 11px; min-height: 16px; }
.prog { display: flex; align-items: center; gap: 8px; font-size: 12px; min-height: 20px; }
.spin { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--amber); opacity: 0; }
.spin.on { opacity: 1; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 3px; width: 100%; background: var(--line); border-radius: 2px; margin: 6px 0; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .4s linear; }
.bar i.done { background: var(--green); }
/* THE DECK (Marko, 15.9.2026: "build me waveform so ... my player is same as a player in my app, Maha Transcribe
   Streamlit"): copied from MAHA_TRANSCRIBE_STREAMLIT/waveform_frontend/index.html. A black scope with the peaks,
   the spoken part in amber, a red playhead, the clock on the right, pages of ten seconds; five cells under it.
   Built once (Deck below) and placed under the text box and in every archive card: one visual language. */
.deck { background: #15181d; border: 1px solid #2b313a; border-radius: 6px; padding: 8px; margin-top: 8px; -webkit-user-select: none; user-select: none; }
.deck .scopewrap { background: var(--bg); border: 1px solid #2b313a; border-radius: 3px; height: 82px; position: relative; overflow: hidden; margin-bottom: 8px; }
.deck canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.deck .clock { position: absolute; right: 0; top: 0; bottom: 0; width: 96px; display: flex; align-items: center; justify-content: center;
  background: var(--bg); border-left: 1px solid #2b313a; font-variant-numeric: tabular-nums; font-size: 13px; color: #9aa3af; z-index: 2; }
.deck .clock.live { color: var(--amber); }
.deck .page { position: absolute; left: 6px; top: 4px; font-size: 10px; color: #9aa3af; z-index: 2; letter-spacing: .06em; }
.deck .row { display: flex; gap: 0; }
.deck .key { flex: 1 1 0; height: 44px; min-width: 0; background: #1d2127; color: #e5e7eb; border: 1px solid #2b313a; border-right-width: 0;
  font: 12px var(--mono); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 2px; text-decoration: none; }
.deck .key:last-child { border-right-width: 1px; border-radius: 0 3px 3px 0; }
.deck .key:first-child { border-radius: 3px 0 0 3px; }
.deck .key.on { background: var(--amber); color: var(--bg); }
.deck .gl { display: inline-flex; flex: none; } .deck .g { display: block; }
.deck.idle .scopewrap, .deck.idle .row { opacity: .38; }        /* dimmed, not hidden: everything is already there */
.deck.idle .row { pointer-events: none; }
.deck .msg { margin-top: 6px; min-height: 14px; font-size: 11px; color: #9aa3af; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--prose); border-radius: 999px; padding: 8px 14px;
  font: 11px var(--mono); letter-spacing: .04em; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.warn { color: var(--red); }
.status { margin-top: 10px; color: var(--dim); font-size: 11px; white-space: pre-wrap; }
.status.err { color: var(--red); }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 6px; background: var(--surface-2); }
.card .t { font-size: 12px; } .card .m { color: var(--dim); font-size: 11px; }
.card audio { width: 100%; margin-top: 6px; }
.keys .card { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.keys .pos { color: var(--dim); font-size: 11px; width: 74px; flex: none; }
.keys .name { flex: 1; min-width: 120px; }
.keys .v { font-size: 11px; width: 100%; color: var(--dim); }
.v.working, .v.valid { color: var(--green); } .v.spent, .v.busy { color: var(--amber); } .v.refused { color: var(--red); }
.fold { border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; background: var(--surface-2); }
.foldhead { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none; color: var(--prose);
  padding: 12px 12px; font: 700 12px var(--mono); letter-spacing: .08em; cursor: pointer; text-align: left; }
.foldhead .arrow { color: var(--amber); width: 12px; flex: none; }
.foldhead .ft { flex: none; }
.foldhead .fs { flex: 1; min-width: 0; color: var(--amber); font-weight: 400; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foldbody { display: none; padding: 0 12px 12px; }
.fold.open .foldbody { display: block; }
.fold.open .arrow { transform: rotate(90deg); display: inline-block; }
.hidden-input { position: absolute; left: -9999px; }
.empty { color: var(--dim); font-size: 12px; padding: 8px 0; }
.foot { margin-top: 14px; color: var(--dim); font-size: 11px; text-align: center; }
</style>
</head>
<body>
<div class="unit">
  <div class="head"><h1>GVOICES</h1><small id="ver">Google's thirty voices</small></div>

  <div class="install">
    <div class="row"><span class="tag">TERMUX</span><code id="curl-termux">…</code><button class="btn" data-copy="curl-termux">COPY</button></div>
    <div class="row"><span class="tag">MAC</span><code id="curl-mac">…</code><button class="btn" data-copy="curl-mac">COPY</button></div>
  </div>

  <div class="tabs">
    <button data-tab="say" class="on">SAY</button>
    <button data-tab="archive">ARCHIVE</button>
    <button data-tab="keys">KEYS</button>
  </div>

  <!-- SAY -->
  <div class="panel on" id="panel-say">
    <label class="lbl">THE TEXT</label>
    <textarea id="text" placeholder="what the voice says…"></textarea>
    <div class="player" id="player">
      <div class="prog" id="prog"><span class="spin" id="spin"></span><span id="progtext">nothing said yet</span></div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="who" id="who"></div>
      <div id="deck-main"></div>
      <div class="status" id="status"></div>
    </div>
    <!-- HOW and VOICE fold away (Marko, 15.9.2026: "collapsible so they don't take much of the real estate ... chooses
         its way of expressing and its voice, and then this can be collapsed") -->
    <div class="fold" id="fold-how">
      <button class="foldhead" data-fold="how"><span class="arrow">▸</span><span class="ft">HOW</span><span class="fs" id="how-summary">plain</span></button>
      <div class="foldbody">
        <div class="filters" id="how-pills"></div>
        <label class="lbl">IN YOUR OWN WORDS (the pills write here; edit freely)</label>
        <input type="text" id="style" placeholder="say it slowly and warmly">
      </div>
    </div>
    <div class="fold" id="fold-voice">
      <button class="foldhead" data-fold="voice"><span class="arrow">▸</span><span class="ft">VOICE</span><span class="fs" id="voice-summary">none chosen</span></button>
      <div class="foldbody">
        <div class="filters" id="filters"></div>
        <div class="voices" id="voices"></div>
      </div>
    </div>
    <button class="big" id="say">SAY IT</button>
  </div>

  <!-- ARCHIVE -->
  <div class="panel" id="panel-archive">
    <div id="archive"></div>
  </div>

  <!-- KEYS -->
  <div class="panel" id="panel-keys">
    <div class="acts">
      <button class="btn" id="pick">CHOOSE A KEYS FILE…</button>
      <input class="hidden-input" type="file" id="keyfile" accept=".txt,.keys,text/plain">
      <button class="btn" id="testall">TEST ALL</button>
    </div>
    <label class="lbl">OR PASTE A NOTE WITH KEYS</label>
    <textarea id="paste" placeholder="a name on one line, the key on the next…"></textarea>
    <div class="acts"><button class="btn" id="import-paste">ADD THESE</button></div>
    <div class="status" id="kstatus"></div>
    <label class="lbl">THE RING, IN ORDER OF USE (the first is in use; a refused one goes to the bottom)</label>
    <div class="keys" id="ring"></div>
    <label class="lbl">REMOVED (kept in keys/removed.keys)</label>
    <div class="keys" id="removed"></div>
  </div>

  <div class="foot">the keys and the audio live only in this app's folder on this machine · <span id="repo"></span></div>
</div>

<script src="http://127.0.0.1:8837/reader.js" onerror="this.remove()"></script>
<script>
(function () {
  'use strict';
  var S = { state: null, voice: null, on: { gender: {}, character: {}, family: {} }, busy: false };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'X-GVoices-Local': '1' }, opts.headers || {});
    if (opts.json) { opts.body = JSON.stringify(opts.json); opts.headers['Content-Type'] = 'application/json'; opts.method = opts.method || 'POST'; }
    return fetch(path, opts).then(function (r) { return r.json().then(function (j) { j._http = r.status; return j; }); });
  }
  function when(t) { var d = new Date(t * 1000); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString().slice(0, 5); }

  // ------------------------------------------------------------ THE DECK, built once, placed everywhere
  // From MAHA_TRANSCRIBE_STREAMLIT/waveform_frontend: peaks, not samples (each column keeps the loudest value of
  // its slice); pages are even divisions under ten seconds; the page turn is instant, never a slide; back and
  // next are five seconds here (no sentence cues); save is the server's download link.
  var PAGE_SECONDS = 10, CLOCK_W = 96;
  var G = { tri: '<svg class="g" viewBox="0 0 12 12" width="11" height="11"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>', par: '<svg class="g" viewBox="0 0 12 12" width="11" height="11"><path d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg>', sq: '<svg class="g" viewBox="0 0 12 12" width="11" height="11"><rect x="1.5" y="1.5" width="9" height="9" fill="currentColor"/></svg>', bk: '<svg class="g" viewBox="0 0 12 12" width="11" height="11"><path d="M11 1v10L2 6z" fill="currentColor"/></svg>', fw: '<svg class="g" viewBox="0 0 12 12" width="11" height="11"><path d="M1 1v10l9-5z" fill="currentColor"/></svg>', dl: '<svg class="g" viewBox="0 0 12 12" width="11" height="11"><path d="M5 1h2v5h2.5L6 10 2.5 6H5z" fill="currentColor"/><rect x="1" y="10.5" width="10" height="1.5" fill="currentColor"/></svg>' };   // drawn, not fetched
  function Deck(host) {
    host.innerHTML = '<div class="deck idle"><div class="scopewrap"><canvas></canvas><div class="page"></div><div class="clock">0:00</div></div>' +
      '<div class="row"><button class="key" data-k="play"><span class="gl">' + G.tri + '</span><span class="lbl">play</span></button>' +
      '<button class="key" data-k="stop"><span class="gl">' + G.sq + '</span><span>stop</span></button>' +
      '<button class="key" data-k="back"><span class="gl">' + G.bk + '</span><span>back</span></button>' +
      '<button class="key" data-k="fwd"><span class="gl">' + G.fw + '</span><span>next</span></button>' +
      '<a class="key" data-k="save" href="#" download><span class="gl">' + G.dl + '</span><span>save</span></a></div><div class="msg"></div></div>';
    var root = host.firstChild, wave = root.querySelector('canvas'), ctx = wave.getContext('2d'), clock = root.querySelector('.clock'),
        pageEl = root.querySelector('.page'), msg = root.querySelector('.msg'), bPlay = root.querySelector('[data-k=play]'),
        gPlay = bPlay.firstChild, lPlay = bPlay.querySelector('.lbl'), bSave = root.querySelector('[data-k=save]');
    var audio = new Audio(), peaks = null, dur = 0, raf = null, src = '';
    function mmss(t) { t = Math.max(0, t | 0); return (t / 60 | 0) + ':' + ('0' + (t % 60)).slice(-2); }
    function pageCount() { return Math.max(1, Math.ceil(dur / PAGE_SECONDS)); }
    function pageSpan() { return dur ? dur / pageCount() : PAGE_SECONDS; }
    function fit() { var r = wave.getBoundingClientRect(), d = window.devicePixelRatio || 1; wave.width = Math.max(1, Math.round(r.width * d)); wave.height = Math.max(1, Math.round(r.height * d)); ctx.setTransform(d, 0, 0, d, 0, 0); }
    function buildPeaks(buf, per) {
      var ch = buf.getChannelData(0), n = Math.max(1, Math.round(buf.duration * per)), step = Math.floor(ch.length / n) || 1, out = new Float32Array(n);
      for (var i = 0; i < n; i++) { var a = i * step, b = Math.min(ch.length, a + step), m = 0; for (var j = a; j < b; j += 2) { var v = ch[j] < 0 ? -ch[j] : ch[j]; if (v > m) m = v; } out[i] = m; }
      return { p: out, per: per };
    }
    function draw() {
      fit();
      var w = wave.clientWidth - CLOCK_W, h = wave.clientHeight, mid = h / 2;
      ctx.clearRect(0, 0, wave.clientWidth, h);
      if (!peaks || !dur) { ctx.strokeStyle = '#2b313a'; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke(); clock.textContent = '0:00'; pageEl.textContent = ''; return; }
      var t = audio.currentTime || 0, sp = pageSpan(), page = Math.min(pageCount() - 1, Math.floor(t / sp)), t0 = page * sp, t1 = Math.min(dur, t0 + sp), span = t1 - t0;
      ctx.fillStyle = '#3f4650';
      for (var x = 0; x < w; x++) { var i = Math.floor((t0 + (x / w) * span) * peaks.per), v = peaks.p[i] || 0, hh = Math.max(1, v * (mid - 4)); ctx.fillRect(x, mid - hh, 1, hh * 2); }
      if (t > t0) {
        var px = Math.min(w, ((t - t0) / span) * w);
        ctx.fillStyle = '#f59e0b';
        for (var x2 = 0; x2 < px; x2++) { var i2 = Math.floor((t0 + (x2 / w) * span) * peaks.per), v2 = peaks.p[i2] || 0, h2 = Math.max(1, v2 * (mid - 4)); ctx.fillRect(x2, mid - h2, 1, h2 * 2); }
        ctx.fillStyle = '#ef4444'; ctx.fillRect(Math.min(w - 1, px), 0, 1.5, h);
      }
      pageEl.textContent = (page + 1) + '/' + pageCount();
      clock.textContent = mmss(t) + ' / ' + mmss(dur);
    }
    function tick() { raf = requestAnimationFrame(tick); draw(); }
    function setPlaying(on) { bPlay.className = 'key' + (on ? ' on' : ''); gPlay.innerHTML = on ? G.par : G.tri; lPlay.textContent = on ? 'pause' : 'play'; clock.className = 'clock' + (on ? ' live' : ''); }
    bPlay.onclick = function () {
      if (!src) return;
      if (audio.paused) audio.play().catch(function (err) { setPlaying(false); msg.textContent = 'this browser would not play it, press play again'; });
      else audio.pause();
    };
    root.querySelector('[data-k=stop]').onclick = function () { audio.pause(); audio.currentTime = 0; setPlaying(false); draw(); };
    root.querySelector('[data-k=back]').onclick = function () { audio.currentTime = Math.max(0, (audio.currentTime || 0) - 5); draw(); };
    root.querySelector('[data-k=fwd]').onclick = function () { audio.currentTime = Math.min(dur || 0, (audio.currentTime || 0) + 5); draw(); };
    wave.onclick = function (e) {
      if (!dur) return;
      var r = wave.getBoundingClientRect(), w = r.width - CLOCK_W, x = e.clientX - r.left; if (x > w) return;
      var sp = pageSpan(), page = Math.min(pageCount() - 1, Math.floor((audio.currentTime || 0) / sp)), t0 = page * sp, span = Math.min(dur, t0 + sp) - t0;
      audio.currentTime = Math.max(0, Math.min(dur, t0 + (x / w) * span)); draw();
    };
    audio.onplay = function () { setPlaying(true); if (!raf) tick(); };
    audio.onpause = function () { setPlaying(false); if (raf) { cancelAnimationFrame(raf); raf = null; } draw(); };
    audio.onended = function () { setPlaying(false); if (raf) { cancelAnimationFrame(raf); raf = null; } draw(); };
    window.addEventListener('resize', draw);
    var deck = {
      load: function (url, name, autoplay) {
        src = url; audio.src = url; peaks = null; dur = 0;
        bSave.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'download=1'; bSave.setAttribute('download', name || 'gvoices.wav');
        root.classList.remove('idle'); msg.textContent = 'reading the audio…'; draw();
        fetch(url).then(function (r) { return r.arrayBuffer(); }).then(function (ab) { var AC = window.AudioContext || window.webkitAudioContext; return new AC().decodeAudioData(ab); })
          .then(function (buf) { dur = buf.duration; peaks = buildPeaks(buf, 200); msg.textContent = ''; draw(); })
          .catch(function () { msg.textContent = 'no waveform for this audio'; dur = audio.duration || 0; draw(); });
        if (autoplay) audio.play().catch(function () { setPlaying(false); msg.textContent = 'press play to hear it'; });
      },
      clear: function () { src = ''; audio.removeAttribute('src'); peaks = null; dur = 0; root.classList.add('idle'); msg.textContent = ''; setPlaying(false); draw(); },
      pause: function () { audio.pause(); }
    };
    setPlaying(false); fit(); draw();
    return deck;
  }
  var mainDeck = Deck($('deck-main'));
  var cardDecks = [];

  // ------------------------------------------------------------ tabs
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('on', p.id === 'panel-' + b.dataset.tab); });
      try { localStorage.setItem('gv.tab', b.dataset.tab); } catch (e) {}
    });
  });
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = $(b.dataset.copy).textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = 'COPIED'; setTimeout(function () { b.textContent = 'COPY'; }, 1500); },
        function () { window.prompt('copy this line', t); });
    });
  });

  // ------------------------------------------------------------ the folds
  function setFold(name, open) {
    $('fold-' + name).classList.toggle('open', open);
    try { localStorage.setItem('gv.fold.' + name, open ? '1' : '0'); } catch (e) {}
  }
  document.querySelectorAll('.foldhead').forEach(function (b) {
    b.addEventListener('click', function () { setFold(b.dataset.fold, !$('fold-' + b.dataset.fold).classList.contains('open')); });
  });

  // ------------------------------------------------------------ HOW: the ways of saying it, combinable
  // Prose directions Gemini follows (gemini-speech.md: the direction is prose in the prompt; [whispers]-style tags
  // are the newer model's). Grouped so a mood, a pace, a volume and a role combine: "warmly, slowly, whispering,
  // like a storyteller".
  var HOW = [
    ['MOOD', ['warmly', 'cheerfully', 'excitedly', 'playfully', 'tenderly', 'lovingly', 'sadly', 'wistfully', 'angrily', 'fearfully', 'calmly', 'seriously', 'solemnly', 'mysteriously', 'sarcastically', 'bored', 'hopefully', 'proudly', 'nervously', 'gratefully']],
    ['PACE', ['very slowly', 'slowly', 'at an easy pace', 'briskly', 'quickly', 'very fast', 'with long pauses', 'without pauses', 'measured, word by word']],
    ['VOLUME', ['whispering', 'softly', 'quietly', 'at a normal volume', 'loudly', 'shouting', 'breathy', 'under the breath']],
    ['TONE', ['gently', 'firmly', 'confidently', 'sincerely', 'dramatically', 'deadpan', 'ironically', 'enthusiastically', 'reassuringly', 'authoritatively', 'humbly', 'tired', 'sleepy', 'energetic']],
    ['AS', ['like a newsreader', 'like a storyteller', 'like a documentary narrator', 'like a teacher', 'like a sports commentator', 'like a meditation guide', 'like a radio host', 'like a poet reciting', 'like a friend on the phone', 'like a stage actor', 'like an audiobook narrator', 'like a flight announcement', 'like a coach', 'like a priest', 'like a child', 'like an old man', 'like an old woman', 'like a robot', 'singing the words']],
    ['SOUNDS', ['laughing between sentences', 'with a sigh first', 'clearing the throat first', 'with a chuckle', 'crying', 'yawning', 'gasping']]
  ];
  function howWords() { return $('style').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
  function renderHow() {
    var have = howWords(), html = '';
    HOW.forEach(function (g) {
      html += '<div class="frow"><span class="tag">' + g[0] + '</span>';
      g[1].forEach(function (w) { html += '<button class="pill small' + (have.indexOf(w) >= 0 ? ' on' : '') + '" data-how="' + esc(w) + '">' + esc(w.toUpperCase()) + '</button>'; });
      html += '</div>';
    });
    $('how-pills').innerHTML = html;
    document.querySelectorAll('#how-pills .pill').forEach(function (b) {
      b.addEventListener('click', function () {
        var w = b.dataset.how, words = howWords(), i = words.indexOf(w);
        if (i >= 0) words.splice(i, 1); else words.push(w);
        $('style').value = words.join(', ');
        try { localStorage.setItem('gv.style', $('style').value); } catch (e) {}
        api('/api/settings', { json: { style: $('style').value } }).catch(function () {});
        renderHow();
      });
    });
    $('how-summary').textContent = have.length ? have.join(', ') : 'plain';
  }
  var styleTimer = null;
  $('style').addEventListener('input', function () { try { localStorage.setItem('gv.style', $('style').value); } catch (e) {} renderHow();
    clearTimeout(styleTimer); styleTimer = setTimeout(function () { api('/api/settings', { json: { style: $('style').value } }).catch(function () {}); }, 600); });

  // ------------------------------------------------------------ the filters and the voices
  function renderFilters() {
    var f = S.state.facets, html = '';
    [['gender', 'GENDER (Google Cloud\'s table)'], ['character', 'CHARACTER (Google\'s one word for each voice)'], ['family', 'FAMILY (grouped here, not by Google)']].forEach(function (row) {
      html += '<div class="frow"><span class="tag">' + row[1] + '</span>';
      f[row[0]].forEach(function (v) {
        html += '<button class="pill small' + (S.on[row[0]][v] ? ' on' : '') + '" data-f="' + row[0] + '" data-v="' + esc(v) + '">' + esc(v.toUpperCase()) + '</button>';
      });
      html += '</div>';
    });
    $('filters').innerHTML = html;
    document.querySelectorAll('#filters .pill').forEach(function (b) {
      b.addEventListener('click', function () { S.on[b.dataset.f][b.dataset.v] = !S.on[b.dataset.f][b.dataset.v]; renderFilters(); renderVoices(); });
    });
  }
  function passes(v) {
    return ['gender', 'character', 'family'].every(function (k) {
      var picked = Object.keys(S.on[k]).filter(function (x) { return S.on[k][x]; });
      return !picked.length || picked.indexOf(v[k]) >= 0;
    });
  }
  function renderVoices() {
    var html = '';
    S.state.voices.forEach(function (v) {
      var glyph = v.gender === 'female' ? '♀' : '♂';
      html += '<button class="voice' + (S.voice === v.name ? ' on' : '') + (passes(v) ? '' : ' hid') + '" data-v="' + v.name + '">' +
        '<div class="nm">' + glyph + ' ' + v.name + '</div><div class="ch">' + esc(v.character) + ' · ' + esc(v.family) + '</div></button>';
    });
    $('voices').innerHTML = html;
    document.querySelectorAll('#voices .voice').forEach(function (b) {
      b.addEventListener('click', function () { S.voice = b.dataset.v; try { localStorage.setItem('gv.voice', S.voice); } catch (e) {} api('/api/settings', { json: { voice: S.voice } }).catch(function () {}); renderVoices(); });
    });
    $('say').disabled = S.busy;
    var v = S.state.voices.filter(function (x) { return x.name === S.voice; })[0];
    $('voice-summary').textContent = v ? (v.name + ' · ' + v.gender + ' · ' + v.character) : 'none chosen';
  }

  // ------------------------------------------------------------ say
  function showItem(it, note) {
    $('who').textContent = it.voice + ' · ' + it.model + ' · ' + it.key + ' · ' + it.seconds + ' s of speech' + (it.took ? ' · took ' + it.took + ' s' : '') + (note ? ' · ' + note : '');
    cardDecks.forEach(function (d) { d.pause(); });
    mainDeck.load('/audio/' + encodeURIComponent(it.file), it.file, true);
  }
  // THE ESTIMATE: seconds of speech ≈ words / 2.6; Google takes about 1.8 × the speech length (gemini-speech.md),
  // corrected by what the archive measured (took / seconds of the last sentences), plus two seconds of the road.
  function estimate(text) {
    var words = text.split(/\s+/).filter(Boolean).length;
    var speech = Math.max(1, words / 2.6);
    var ratios = (S.state.archive || []).filter(function (it) { return it.took && it.seconds; }).slice(0, 8).map(function (it) { return it.took / it.seconds; });
    var ratio = ratios.length ? ratios.sort(function (a, b) { return a - b; })[Math.floor(ratios.length / 2)] : 1.8;
    return Math.round(speech * ratio + 2);
  }
  var poll = null, t0 = 0, est = 0;
  function tick() {
    var el = (Date.now() - t0) / 1000;
    $('progtext').textContent = 'working… ' + el.toFixed(0) + ' s of about ' + est + ' s' + (el > est ? ' (Google is slower than the estimate, still waiting)' : '');
    $('barfill').style.width = Math.min(96, 100 * el / est) + '%';
    api('/api/progress').then(function (p) {
      if (p.lines && p.lines.length) $('status').textContent = p.lines.map(function (l, i) { return (i + 1) + '. ' + l; }).join('\n');
    }).catch(function () {});
  }
  $('say').addEventListener('click', function () {
    var text = $('text').value.trim();
    if (S.busy) return;
    function why(msg) { $('spin').classList.remove('on'); $('barfill').className = ''; $('barfill').style.width = '100%'; $('barfill').style.background = 'var(--red)'; $('progtext').textContent = 'no voice: ' + msg; $('status').className = 'status err'; $('status').textContent = ''; }
    if (!text) { why('nothing to say, the text box is empty'); $('text').focus(); return; }
    if (!S.voice) { why('no voice chosen, open VOICE and pick one'); setFold('voice', true); return; }
    if (!(S.state.ring || []).length) { why('the ring is empty, on the KEYS tab choose the file with your Google keys'); return; }
    S.busy = true; $('say').disabled = true; $('say').textContent = 'ASKING GOOGLE…';
    est = estimate(text); t0 = Date.now();
    $('spin').classList.add('on'); $('barfill').className = ''; $('barfill').style.width = '2%';
    $('progtext').textContent = 'sending ' + text.split(/\s+/).filter(Boolean).length + ' words to ' + S.voice + '… about ' + est + ' s';
    $('status').className = 'status'; $('status').textContent = '1. one key at a time, the first in the ring';
    $('who').textContent = '';
    poll = setInterval(tick, 500);
    api('/api/say', { json: { text: text, voice: S.voice, style: $('style').value } }).then(function (r) {
      clearInterval(poll); S.busy = false; $('say').disabled = false; $('say').textContent = 'SAY IT';
      $('spin').classList.remove('on');
      var took = ((Date.now() - t0) / 1000).toFixed(1);
      if (r.ring) S.state.ring = r.ring;
      if (!r.ok) {
        $('barfill').style.width = '100%'; $('barfill').style.background = 'var(--red)';
        $('progtext').textContent = 'no voice: ' + r.error + ' (' + took + ' s)';
        $('status').className = 'status err'; $('status').textContent = (r.log || []).map(function (l, i) { return (i + 1) + '. ' + l; }).join('\n'); renderRing(); return;
      }
      $('barfill').style.width = '100%'; $('barfill').className = 'done'; $('barfill').style.background = '';
      $('progtext').textContent = (r.cached ? 'from the archive, nothing spent' : 'the voice arrived') + ' · ' + took + ' s' + (r.cached ? '' : ' (estimated ' + est + ' s)');
      $('status').textContent = (r.log || []).map(function (l, i) { return (i + 1) + '. ' + l; }).join('\n');
      showItem(r.item, r.cached ? 'cached' : 'new');
      if (!r.cached) { S.state.archive.unshift(r.item); }
      renderArchive(); renderRing();
    }).catch(function (e) { clearInterval(poll); S.busy = false; $('say').disabled = false; $('say').textContent = 'SAY IT'; $('spin').classList.remove('on'); $('progtext').textContent = 'the server does not answer'; $('status').className = 'status err'; $('status').textContent = String(e); });
  });

  // ------------------------------------------------------------ archive
  function renderArchive() {
    var items = S.state.archive || [], html = '';
    if (!items.length) html = '<div class="empty">nothing said yet</div>';
    items.forEach(function (it) {
      html += '<div class="card" data-id="' + esc(it.id) + '"><div class="t">' + esc(it.text) + '</div>' +
        '<div class="m">' + esc(it.voice) + (it.style ? ' · ' + esc(it.style) : '') + ' · ' + esc(it.model) + ' · ' + esc(it.key) + ' · ' + it.seconds + ' s · ' + when(it.at) + '</div>' +
        '<div class="deck-slot" data-file="' + esc(it.file) + '"></div>' +
        '<div class="acts"><button class="btn" data-again="' + esc(it.id) + '">SAY AGAIN</button><button class="btn warn" data-del="' + esc(it.id) + '">DELETE</button></div></div>';
    });
    $('archive').innerHTML = html;
    cardDecks.forEach(function (d) { d.pause(); }); cardDecks = [];
    document.querySelectorAll('#archive .deck-slot').forEach(function (slot) {
      var d = Deck(slot); d.load('/audio/' + encodeURIComponent(slot.dataset.file), slot.dataset.file, false); cardDecks.push(d);
    });
    document.querySelectorAll('#archive [data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        api('/api/archive/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' }).then(function (r) { S.state.archive = r.archive || []; renderArchive(); });
      });
    });
    document.querySelectorAll('#archive [data-again]').forEach(function (b) {
      b.addEventListener('click', function () {
        var it = items.filter(function (x) { return x.id === b.dataset.again; })[0];
        if (!it) return;
        $('text').value = it.text; $('style').value = it.style || ''; S.voice = it.voice; renderHow(); renderVoices();
        document.querySelector('.tabs button[data-tab=say]').click();
        $('progtext').textContent = 'from the archive'; $('barfill').className = 'done'; $('barfill').style.width = '100%';
        showItem(it, 'from the archive');
      });
    });
  }

  // ------------------------------------------------------------ keys
  function renderRing() {
    var ring = S.state.ring || [], html = '';
    if (!ring.length) html = '<div class="empty">no keys yet: choose the file with your Google keys, a name on one line and the key on the next</div>';
    ring.forEach(function (k) {
      html += '<div class="card"><span class="pos">key ' + k.pos + ' of ' + k.of + (k.pos === 1 ? ' · IN USE' : '') + '</span><span class="name">' + esc(k.label) + '</span>' +
        '<button class="btn" data-test="' + esc(k.label) + '">TEST</button><button class="btn" data-bottom="' + esc(k.label) + '">TO THE BOTTOM</button>' +
        '<button class="btn warn" data-kdel="' + esc(k.label) + '">DELETE</button>' +
        '<span class="v ' + esc(k.verdict) + '">' + esc(k.verdict) + (k.detail ? ' · ' + esc(k.detail) : '') + (k.at ? ' · ' + when(k.at) : '') + '</span></div>';
    });
    $('ring').innerHTML = html;
    var rem = S.state.removed || [], rh = '';
    if (!rem.length) rh = '<div class="empty">none removed</div>';
    rem.forEach(function (l) { rh += '<div class="card"><span class="name">' + esc(l) + '</span><button class="btn" data-restore="' + esc(l) + '">PUT BACK</button></div>'; });
    $('removed').innerHTML = rh;
    var take = function (r) { if (r.ring) S.state.ring = r.ring; if (r.removed_names) S.state.removed = r.removed_names; renderRing(); };
    document.querySelectorAll('#ring [data-test]').forEach(function (b) { b.addEventListener('click', function () {
      b.textContent = 'TESTING…'; api('/api/keys/test', { json: { labels: [b.dataset.test] } }).then(function (r) { $('kstatus').textContent = (r.tested || []).map(function (t) { return t.label + ': ' + t.verdict + ', ' + t.detail; }).join('\n'); take(r); }); }); });
    document.querySelectorAll('#ring [data-bottom]').forEach(function (b) { b.addEventListener('click', function () { api('/api/keys/bottom', { json: { label: b.dataset.bottom } }).then(take); }); });
    document.querySelectorAll('#ring [data-kdel]').forEach(function (b) { b.addEventListener('click', function () { api('/api/keys/delete', { json: { labels: [b.dataset.kdel] } }).then(function (r) { $('kstatus').textContent = 'removed ' + r.removed + ', kept in keys/removed.keys'; take(r); }); }); });
    document.querySelectorAll('#removed [data-restore]').forEach(function (b) { b.addEventListener('click', function () { api('/api/keys/restore', { json: { labels: [b.dataset.restore] } }).then(function (r) { $('kstatus').textContent = 'put back ' + r.added; take(r); }); }); });
  }
  function importResult(r) {
    var s = 'added ' + r.added + ', already there ' + r.skipped + ', ring ' + r.total;
    if (r.unknown && r.unknown.length) s += '\n' + r.unknown.length + ' long token(s) of a shape this app does not know, NOT imported: line ' + r.unknown.map(function (u) { return u.line; }).join(', ');
    $('kstatus').textContent = s;
    if (r.ring) S.state.ring = r.ring;
    renderRing();
  }
  $('pick').addEventListener('click', function () { $('keyfile').click(); });
  $('keyfile').addEventListener('change', function () {
    var f = $('keyfile').files[0]; if (!f) return;
    var fd = new FormData(); fd.append('keyfile', f, f.name);
    $('kstatus').textContent = 'reading ' + f.name + ' (' + f.size + ' bytes)…';
    api('/api/keys/import', { method: 'POST', body: fd }).then(importResult);
    $('keyfile').value = '';
  });
  $('import-paste').addEventListener('click', function () {
    var t = $('paste').value; if (!t.trim()) return;
    api('/api/keys/import', { json: { text: t } }).then(function (r) { $('paste').value = ''; importResult(r); });
  });
  $('testall').addEventListener('click', function () {
    $('testall').textContent = 'TESTING, ONE AFTER ANOTHER…';
    api('/api/keys/test', { json: {} }).then(function (r) {
      $('testall').textContent = 'TEST ALL';
      $('kstatus').textContent = (r.tested || []).map(function (t) { return t.label + ': ' + t.verdict + ', ' + t.detail; }).join('\n');
      if (r.ring) S.state.ring = r.ring; renderRing();
    });
  });

  // ------------------------------------------------------------ start
  api('/api/state').then(function (st) {
    S.state = st;
    $('ver').textContent = 'v' + st.version + ' · ' + st.voices.length + ' voices · port ' + st.port;
    $('curl-termux').textContent = st.install.termux; $('curl-mac').textContent = st.install.mac;
    $('repo').innerHTML = '<a class="btn" href="' + st.repo + '" target="_blank" rel="noopener">GITHUB</a>';
    S.voice = (st.settings && st.settings.voice) || null;          // the server remembers between sessions; the first start is Sulafat
    if (S.voice && !st.voices.some(function (v) { return v.name === S.voice; })) S.voice = null;
    $('style').value = (st.settings && st.settings.style) || '';
    renderHow(); renderFilters(); renderVoices(); renderArchive(); renderRing();
    var fh = null, fv = null;
    try { fh = localStorage.getItem('gv.fold.how'); fv = localStorage.getItem('gv.fold.voice'); } catch (e) {}
    setFold('how', fh === '1');
    setFold('voice', fv === null ? !S.voice : fv === '1');
    try { var t = localStorage.getItem('gv.tab'); if (t) { var b = document.querySelector('.tabs button[data-tab=' + t + ']'); if (b) b.click(); } } catch (e) {}
    if (window.MantraReader && window.MantraReader.attach) { /* READ buttons come with reader.js when the voice is up */ }
  }).catch(function (e) { $('status').className = 'status err'; $('status').textContent = 'the server does not answer: ' + e; });
})();
</script>
</body>
</html>
